[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-hippo-boundary-em"
version = "0.1.0"
description = "Minimal differentiable episodic-memory boundary encoding experiment"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
report = [
  "matplotlib>=3.8",
  "scipy>=1.12",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["boundary_em*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
