experiment:
  name: neural_counterfactual_smoke
  status: smoke_test
  model_seeds: [0]

task:
  profile: released_code
  condition: DM
  evaluation_mode: true

model:
  policy_hidden_dim: 16
  retrieval_temperature: 0.05
  temporal_context_scale: 2.0
  content_match_threshold: 0.6
  content_match_sharpness: 30.0
  retrieval_strength: 0.2

counterfactual_banks:
  training_examples: 1
  evaluation_examples: 1
  training_seed_start: 41000000
  evaluation_seed_start: 42000000
  memory_capacity: 2

curriculum:
  conditions: [DM]
  training_examples: 1
  training_seed_start: 40500000
  updates: 1
  batch_size: 1
  learning_rate: 0.003
  gradient_clip: 10.0
  checkpoint_interval: 1

optimization:
  initial_probability: 0.05
  updates: 2
  batch_size: 1
  learning_rate: 0.003
  gradient_clip: 10.0
  checkpoint_interval: 1

output:
  directory: outputs/paper_task_encoding/neural_counterfactual
