experiment:
  name: exact_paper_task_smoke
  status: smoke
  model_seeds: [0, 1]

task:
  profile: released_code

model:
  policy_hidden_dim: 16
  retrieval_temperature: 0.05
  temporal_context_scale: 2.0
  content_match_threshold: 0.6
  content_match_sharpness: 30.0
  retrieval_strength: 0.2
  initial_encoding_probability: 0.02

training:
  conditions: [RM, DM, NM, NM]
  forced_value:
    updates: 2
    batch_size: 2
    learning_rate: 0.003
    critic_coefficient: 0.5
    entropy_coefficient: 0.002
    gradient_clip: 1.0
    memory_capacity: 40
  free_policy:
    updates: 2
    batch_size: 2
    learning_rate: 0.003
    critic_coefficient: 0.5
    entropy_coefficient: 0.002
    gradient_clip: 1.0
    memory_capacity: 40

checkpoint_evaluation:
  interval_updates: 1
  trials_per_condition: 2
  trial_seed_start: 27000000
  action_seed_start: 28000000
  conditions: [DM]
  save_weights: true

evaluation:
  trial_seed_start: 25000000
  trials_per_condition: 4
  action_seed_start: 26000000
  conditions: [RM, DM, NM]
  forced_baselines: [endpoint_only, midpoint_only, midpoint_plus_endpoint, dense, never, matched_random_one]
  ablations: [retrieval_off, target_memory_removed, lure_memory_removed, content_gate_off]

output:
  directory: outputs/paper_task_encoding/smoke
