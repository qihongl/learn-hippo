experiment:
  name: sampled_hazard_dm_variable_replication
  status: exploratory_multiseed_replication
  model_seeds: [920, 921, 922, 923, 924, 925, 926, 927, 928, 929]

task:
  profile: released_code
  training_conditions: [DM]
  training_evaluation_mode: false

model:
  policy_hidden_dim: 32
  retrieval_temperature: 0.05
  temporal_context_scale: 2.0
  content_match_threshold: 0.6
  content_match_sharpness: 30.0
  retrieval_strength: 0.2

policy:
  initial_probability: 0.05

training:
  forced_value:
    updates: 400
    batch_size: 16
    learning_rate: 0.003
    critic_coefficient: 0.5
    entropy_coefficient: 0.0
    gradient_clip: 1.0
    memory_capacity: 2
  free_policy:
    updates: 6400
    batch_size: 16
    learning_rate: 0.001
    critic_coefficient: 0.5
    entropy_coefficient: 0.001
    gradient_clip: 1.0
    memory_capacity: 2

checkpoint_evaluation:
  interval_updates: 160
  trials: 128
  trial_seed_start: 92000000
  conditions: [DM]
  evaluation_mode: false

output:
  directory: outputs/paper_task_encoding/sampled_hazard
