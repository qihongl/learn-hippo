experiment:
  name: sampled_hazard_smoke
  status: smoke_test
  model_seeds: [0]

task:
  profile: released_code
  training_conditions: [DM]
  training_evaluation_mode: true

model:
  policy_hidden_dim: 16
  retrieval_temperature: 0.05
  temporal_context_scale: 2.0
  content_match_threshold: 0.6
  content_match_sharpness: 30.0
  retrieval_strength: 0.2

policy:
  initial_probability: 0.05

training:
  forced_value:
    updates: 1
    batch_size: 1
    learning_rate: 0.003
    critic_coefficient: 0.5
    entropy_coefficient: 0.0
    gradient_clip: 10.0
    memory_capacity: 2
  free_policy:
    updates: 2
    batch_size: 1
    learning_rate: 0.003
    critic_coefficient: 0.5
    entropy_coefficient: 0.001
    gradient_clip: 10.0
    memory_capacity: 2

checkpoint_evaluation:
  interval_updates: 1
  trials: 1
  trial_seed_start: 52000000

output:
  directory: outputs/paper_task_encoding/sampled_hazard
