experiment:
  name: sampled_hazard_stability_replication_b32
  status: locked_optimizer_replication
  model_seeds: [980, 981, 982, 983, 984, 985, 986, 987, 988, 989]

task:
  profile: released_code
  training_conditions: [RM, DM, NM, NM]
  training_evaluation_mode: false

model:
  policy_hidden_dim: 32
  retrieval_temperature: 0.05
  temporal_context_scale: 2.0
  content_match_threshold: 0.6
  content_match_sharpness: 30.0
  retrieval_strength: 0.2
  policy_mode: state_mlp

policy:
  initial_probability: 0.05

training:
  forced_value:
    updates: 400
    batch_size: 16
    learning_rate: 0.003
    critic_coefficient: 0.5
    entropy_coefficient: 0.0
    gradient_clip: 1.0
    memory_capacity: 2
  free_policy:
    updates: 3200
    batch_size: 32
    learning_rate: 0.001
    learning_rate_schedule: constant
    minimum_learning_rate_fraction: 0.05
    critic_coefficient: 0.5
    entropy_coefficient: 0.001
    gradient_clip: 1.0
    memory_capacity: 2
    advantage_mode: condition_centered
    condition_schedule: dm_to_mixture

checkpoint_evaluation:
  interval_updates: 80
  trials: 128
  trial_seed_start: 101000000
  conditions: [RM, DM, NM]
  evaluation_mode: false

output:
  directory: outputs/paper_task_encoding/sampled_hazard
